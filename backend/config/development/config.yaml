app:
  name: "Journey Hub"
  version: "0.1.0"
  environment: "development"
  debug: true

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"
  allow_origins: ["*"]

database:
  uri: "mongodb://mongo:27017"
  name: "journeyhub"
  connect_timeout: "10s"
  max_conn_idle_time: "60s"
  max_pool_size: 100
  user: "admin"
  # Sample encrypted password (will be decrypted automatically)
  password: "ENC:LdGclC2L0Uil4mURULGBdOBpRDNQaSTUYFTta1O6jl6SDCdijWRxJRIuueP1xEWK/g=="
  enable_command_monitor: false

redis:
  uri: "redis:6379"
  # Sample encrypted password (will be decrypted automatically)
  password: "ENC:LdGclC2L0Uil4mURULGBdOBpRDNQaSTUYFTta1O6jl6SDCdijWRxJRIuueP1xEWK/g=="
  db: 0
  pool_size: 10
  connect_timeout: "5s"
  max_retries: 3
  min_idle_conns: 2
  idle_timeout: "5m"
  enable_cache_prefix: true
  cache_prefix: "jh:"

storage:
  endpoint: "minio:9000"
  access_key_id: "minioadmin"
  # Sample encrypted secret key (will be decrypted automatically)
  secret_access_key: "ENC:rad5jvGLHvWkeSEMUUgzs5m2l/yQWLbYwvDGPh0ta4KLGx0UP2sR6LJPnCLnIlaXZwAM"
  use_ssl: false
  bucket_name: "journeyhub"
  location: "us-east-1"
  base_path: "uploads"

jwt:
  # Sample encrypted JWT secret (will be decrypted automatically)
  secret: "ENC:SZf4bbt6orsmAqjQRl465TP6gR8eSjbUYRtbyZkoC392rD6DRFezcGaYQRWnnx6r+i5IW+DBBarGjx5/iwqmyiTOozoxkP6u"
  access_token_ttl: "15m"
  refresh_token_ttl: "168h"
  issuer: "journeyhub"
  audience: "journeyhub-users"
  signing_algorithm: "HS256"

log:
  level: "debug"  # debug, info, warn, error, fatal
  format: "console"  # json, console
  output: "stdout"  # stdout, file
  enable_file: false
  file_path: "logs/app.log"
  max_size: 10  # 10MB
  max_backups: 3
  max_age: 7  # 7 days
  compress: true

swagger:
  enabled: true
  host: "localhost:8080"
  base_path: "/api/v1"
  schemes: "http,https"
  title: "Journey Hub API"
  description: "API for Journey Hub travel platform"
  version: "1.0"

monitoring:
  enabled: true
  prometheus_port: 9090
  health_check_path: "/health" 