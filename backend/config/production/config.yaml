app:
  name: "Journey Hub"
  version: "0.1.0"
  environment: "production"
  debug: false

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"
  allow_origins: ["https://journeyhub.com", "https://www.journeyhub.com"]

database:
  uri: "mongodb://mongo:27017"
  name: "journeyhub_prod"
  connect_timeout: "10s"
  max_conn_idle_time: "60s"
  max_pool_size: 200
  user: "admin"
  # Sample encrypted password (will be decrypted automatically)
  password: "ENC:4Nk1CoeKA91W+tTEXXBwZ5WOTtTx1wQ9QdIlphFwqYGFkSmYhfwP9BC3iitaHAFjYA=="
  enable_command_monitor: false

redis:
  uri: "redis:6379"
  # Sample encrypted password (will be decrypted automatically)
  password: "ENC:4Nk1CoeKA91W+tTEXXBwZ5WOTtTx1wQ9QdIlphFwqYGFkSmYhfwP9BC3iitaHAFjYA=="
  db: 0
  pool_size: 20
  connect_timeout: "5s"
  max_retries: 5
  min_idle_conns: 5
  idle_timeout: "5m"
  enable_cache_prefix: true
  cache_prefix: "jh_prod:"

storage:
  endpoint: "minio:9000"
  access_key_id: "minioadmin"
  # Sample encrypted secret key (will be decrypted automatically)
  secret_access_key: "ENC:wTsDvlx89J9+ju5RnGpqZh+VsJU6NFB9NZtI8xFu3av7v26q2bWzYP+CQx+FqyShHrbh"
  use_ssl: true
  bucket_name: "journeyhub-production"
  location: "us-east-1"
  base_path: "uploads"

jwt:
  # Sample encrypted JWT secret (will be decrypted automatically)
  secret: "ENC:x5DWNLN/6JSvwcLzSKOmYp5VtExw+5+EHx+CEHLjqv20dul/etUpgLskGacnFBB/sfEB9UkOs1XqYoA47PXp5La1dycAMjiR"
  access_token_ttl: "15m"
  refresh_token_ttl: "168h"
  issuer: "journeyhub"
  audience: "journeyhub-users"
  signing_algorithm: "HS256"

log:
  level: "info"  # debug, info, warn, error, fatal
  format: "json"  # json, console
  output: "file"  # stdout, file
  enable_file: true
  file_path: "logs/app.log"
  max_size: 100  # 100MB
  max_backups: 10
  max_age: 30  # 30 days
  compress: true

swagger:
  enabled: false  # Disabled in production
  host: "api.journeyhub.com"
  base_path: "/v1"
  schemes: "https"
  title: "Journey Hub API"
  description: "API for Journey Hub travel platform"
  version: "1.0"

monitoring:
  enabled: true
  prometheus_port: 9090
  health_check_path: "/health" 