name: Swagger Documentation

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/internal/interfaces/api/http/handlers/**'
      - 'backend/cmd/api/**'
      - 'backend/api/swagger/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/internal/interfaces/api/http/handlers/**'
      - 'backend/cmd/api/**'
      - 'backend/api/swagger/**'
  workflow_dispatch:

jobs:
  generate-swagger:
    name: Generate Swagger Documentation
    runs-on: ubuntu-latest
    env:
      JH_SKIP_CONFIG_ENCRYPTION: "true"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      
      - name: Install Swag
        run: go install github.com/swaggo/swag/cmd/swag@latest
      
      - name: Generate Swagger docs
        working-directory: ./backend
        run: |
          mkdir -p api/swagger/gen
          swag init --parseDependency --parseInternal --parseDepth 1 \
            --dir ./cmd/api,./internal/interfaces/api/http/handlers \
            --generatedTime \
            --outputTypes json,yaml \
            --output ./api/swagger/gen
      
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet ./backend/api/swagger/gen || echo "changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit changes
        if: steps.git-check.outputs.changes == 'true' && github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ./backend/api/swagger/gen
          git commit -m "Auto-update Swagger documentation"
          git push 