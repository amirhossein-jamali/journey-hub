name: Go Vulnerability Check

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:  # Allow manual triggers
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sundays at midnight

jobs:
  govulncheck:
    name: Check for vulnerabilities
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      JH_SKIP_CONFIG_ENCRYPTION: "true"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck ./...
        
      - name: Report vulnerabilities
        if: failure()
        run: |
          echo "::warning::Vulnerabilities found in dependencies. Please review the logs and update affected dependencies."

      - name: Save govulncheck report
        if: always()
        run: |
          mkdir -p reports
          govulncheck -json ./... > reports/govulncheck.json || true
          
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulnerability-report
          path: backend/reports/govulncheck.json
          retention-days: 30 